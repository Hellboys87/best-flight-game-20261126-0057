<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline Courier — a golden-hour flight game</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1d2a4a;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
  #help {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 10px;
    color: rgba(255, 255, 255, 0.55);
    font: 12px "Segoe UI", system-ui, sans-serif;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="help">Arrows / WASD fly &middot; Shift / Ctrl throttle &middot; M mouse steering &middot; P pause &middot; R restart</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
